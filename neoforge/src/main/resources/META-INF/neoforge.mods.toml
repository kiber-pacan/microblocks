modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "${license}"

[[mods]]
modId = "${modid}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = "${description}"
${neoforge_logo_key} = "assets/${modid}/icon.png"

[[dependencies.${modid}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_loader_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"



[[dependencies.${modid}]]
modId = "akilib"
type = "required"
versionRange = "[${akilib_version},)"
ordering = "AFTER"
side = "BOTH"
