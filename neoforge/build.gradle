import groovy.json.JsonSlurper
plugins {
    id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}


repositories {
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

int version_index = Integer.valueOf(rootProject.version_index)

dependencies {
    // test runs with --fast-mods: mods that make the game start sooner, where a release exists for this version
    if (rootProject.hasProperty("fastmods")) {
        ["modernfix", "ferrite-core", "lazydfu"].each { String mod ->
            def version = rootProject.findProperty(mod.replace("-", "_") + "_version_neoforge")
            if (version) add((version_index < 18) ? "modLocalRuntime" : "localRuntime", "maven.modrinth:${mod}:${version}")
        }
    }

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    def impl_type = (version_index < 18) ? "modImplementation" : "implementation"

    add impl_type, "maven.modrinth:architectury-api:${rootProject.architectury_api_version_neoforge}"

    // Aki Lib: the library mod that these mods require (its jars for this version are copied into libs/akilib by the build script of the workspace)
    add impl_type, files(file("${rootProject.projectDir}/libs/akilib/akilib-mc${rootProject.minecraft_version}-${project.name}-${rootProject.akilib_version}.jar"))

    if (version_index < 18)
        common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    else
        common(project(path: ':common')) { transitive false }


    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge'))
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'legacyBlockstates', version_index < 11

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
    if (version_index < 11) {
        // before 1.21.5 a blockstate file names a model (the mod puts its own model in place of it when it is baked)
        filesMatching('assets/microblocks/blockstates/holder.json') {
            filter { line -> '{"variants": {"": {"model": "microblocks:block/holder"}}}' }
        }
    }
}

shadowJar {
    if (version_index < 18) {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = 'dev-shadow'
    } else {
        configurations = [project.configurations.shadowBundle]

        from(sourceSets.main.output.classesDirs)
        from(sourceSets.main.output.resourcesDir)

        archiveClassifier = ""
    }
}

if (version_index < 18) {
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
} else {
    jar {
        archiveClassifier.set("dev")
    }
    shadowJar {
        archiveClassifier.set("")
    }
    assemble {
        dependsOn("shadowJar")
    }
}
