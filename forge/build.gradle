plugins {
    id 'com.gradleup.shadow' version '8.3.6'
}

// VARIABLES
int version_index = Integer.valueOf(providers.gradleProperty("version_index").get())

architectury {
    platformSetupLoomIde()
    forge()
}

repositories {
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common


    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // test runs with --fast-mods: mods that make the game start sooner, where a release exists for this version
    if (rootProject.hasProperty("fastmods")) {
        // ModernFix on Forge needs MixinExtras, which the dev environment of Forge 1.18 - 1.20.1 does not have: the game dies on start-up
        // with it. FerriteCore is enough there.
        (["ferrite-core"]).each { String mod ->
            def version = rootProject.findProperty(mod.replace("-", "_") + "_version_forge")
            if (version) add((version_index < 18) ? "modLocalRuntime" : "localRuntime", "maven.modrinth:${mod}:${version}")
        }
    }

    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "maven.modrinth:architectury-api:$rootProject.architectury_api_version_forge"
    modImplementation files(file("${rootProject.projectDir}/libs/akilib/akilib-mc${rootProject.minecraft_version}-forge-${rootProject.akilib_version}.jar"))

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}





// JAR
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}