# The chisels and the drills on ordinary blocks: they turn into microblocks with holes.
name: microblocks tools
world: true
steps:
  - wait: title
  - open-world: TestWorld
  - wait: world
  - peaceful-world: yes
  - command: gamemode creative @p
  - command: time set day
  - command: weather clear
  - command: tp @p ~ -60 ~ 0 25
  - wait: 4s
  - micro-tools: yes
  - wait: 3s
  - screenshot: tools
